  <pre>context(N);

for i in range(0, ((N - 1) + 1)) {
  for j in range(0, ((N - 1) + 1)) {
    for k in range(0, ((j - 1) + 1)) {
      B[j][i] = (B[j][i] - (L[j][k] * B[k][i]));
    }
    B[j][i] = (B[j][i] / L[j][j]);
  }
}
