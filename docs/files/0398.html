  <pre>context(N);

for i in range(0, N) {
  for j in range(0, N) {
    for k in range((i + 1), N) {
      if (k == (i + 1)) {
        b[j][i] = (b[j][i] / a[i][i]);
      }
      b[j][k] = (b[j][k] - (a[i][k] * b[j][i]));
    }
  }
}
