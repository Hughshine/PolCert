  <pre>context(n);

for i in range(0, n) {
  for j in range(0, n) {
    a[i][j] = (b[i][(j - 1)] + a[i][(j - 1)]);
    b[i][j] = (a[(i - 1)][(j + 1)] + b[(i - 1)][j]);
  }
}
