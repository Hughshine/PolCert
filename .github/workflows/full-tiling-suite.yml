name: full-tiling-suite

on:
  workflow_dispatch:

concurrency:
  group: full-tiling-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CACHE_SCOPE: polcert-full-${{ github.ref_name }}

jobs:
  polopt-loop-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load Pluto baseline
        run: >-
          grep -v '^[[:space:]]*#' tools/ci/pluto-baseline.env |
          grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build suite image from the repository Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          load: true
          tags: polcert-tiling-ci:gha
          build-args: |
            PLUTO_IMAGE=${{ env.PLUTO_IMAGE }}
            PLUTO_GIT_REMOTE=${{ env.PLUTO_GIT_REMOTE }}
            PLUTO_GIT_COMMIT=${{ env.PLUTO_GIT_COMMIT }}
          cache-from: |
            type=gha,scope=${{ env.CI_CACHE_SCOPE }}
            type=gha,scope=polcert-ci-main
            type=gha,scope=buildkit
          cache-to: type=gha,mode=max,scope=${{ env.CI_CACHE_SCOPE }}
      - name: Run isolated test shards
        run: bash tools/ci/run_ci_shards.sh polcert-tiling-ci:gha
