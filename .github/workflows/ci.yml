name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  proof-build-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Pluto baseline
        run: >-
          grep -v '^[[:space:]]*#' tools/ci/pluto-baseline.env |
          grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verified CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          load: true
          tags: polcert-ci:gha
          build-args: |
            PLUTO_IMAGE=${{ env.PLUTO_IMAGE }}
            PLUTO_GIT_REMOTE=${{ env.PLUTO_GIT_REMOTE }}
            PLUTO_GIT_COMMIT=${{ env.PLUTO_GIT_COMMIT }}
          cache-from: |
            type=gha,scope=polcert-ci
            type=gha,scope=buildkit
          cache-to: type=gha,mode=max,scope=polcert-ci

      - name: Run isolated test shards
        run: bash tools/ci/run_ci_shards.sh polcert-ci:gha
