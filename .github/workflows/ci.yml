name: ci

on:
  push:
    branches:
      - main
      - extractor
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_CACHE_SCOPE: polcert-ci-${{ github.event.pull_request.number || github.ref_name }}

jobs:
  proof-build-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load Pluto baseline
        run: >-
          grep -v '^[[:space:]]*#' tools/ci/pluto-baseline.env |
          grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build verified CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci
          load: true
          tags: polcert-ci:gha
          build-args: |
            PLUTO_IMAGE=${{ env.PLUTO_IMAGE }}
            PLUTO_GIT_REMOTE=${{ env.PLUTO_GIT_REMOTE }}
            PLUTO_GIT_COMMIT=${{ env.PLUTO_GIT_COMMIT }}
            POLCERT_GIT_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ env.CI_CACHE_SCOPE }}
            type=gha,scope=polcert-ci-main
            type=gha,scope=buildkit
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=polcert-ci-main' || '' }}

      - name: Run isolated test shards
        run: bash tools/ci/run_ci_shards.sh polcert-ci:gha
