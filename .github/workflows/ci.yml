name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-build-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -t polcert-ci .

      - name: Run clean build, proof checks, polcert tests, and strict polopt suite
        run: >-
          docker run --rm --entrypoint bash polcert-ci
          -lc 'bash /polcert/tools/ci/run_ci.sh'
